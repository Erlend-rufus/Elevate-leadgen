[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite build output is content-hashed — safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy funnel assets (shared by /lp, /takk.html, /geo-audit, /case)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Visibility Dossier SPA is served at /audit/ (prebuilt output committed in
# public/audit/ — rebuild via: cd dossier && npm run build && cp -r dist ../public/audit).
[[headers]]
  for = "/audit/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/audit/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Nevari client proposal (served at /nevari/). Keep it out of search indexes:
# it contains commercial terms and must not be indexable.
[[headers]]
  for = "/nevari/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/nevari/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/nevari/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Redirects. ORDER MATTERS: specific rules must come before the SPA catch-all.
# Netlify serves real files first, so everything under public/ (lp, geo-audit,
# audit, case, nevari, takk.html, not-a-fit.html, css, js, images) always wins
# over these rewrites.
# ---------------------------------------------------------------------------

# Visibility Dossier SPA fallback: unknown /audit/* paths serve its app shell
[[redirects]]
  from = "/audit/*"
  to = "/audit/index.html"
  status = 200

# The Journey — scroll-story landing page (Kimi-built, static single file).
# Client-chosen URL is /the-journey. Must stay before the SPA catch-all.
[[redirects]]
  from = "/the-journey"
  to = "/journey.html"
  status = 200

[[redirects]]
  from = "/the-journey/"
  to = "/journey.html"
  status = 200

# Legacy landing page (moved from / to /lp): unknown /lp/* paths serve it
[[redirects]]
  from = "/lp/*"
  to = "/lp/index.html"
  status = 200

# React SPA fallback — deep links like /results must serve the app shell.
# MUST stay last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

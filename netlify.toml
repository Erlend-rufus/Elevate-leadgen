[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Functions: /uk-it-firms/apply (the older IT funnel's application form), /api/lead (the growth
# funnels' application form) and the daily lead check. esbuild is named rather than left to the
# default so the bundle is the same wherever it builds: the functions import modules from
# g/uk-it-larger-firms/ (CommonJS) and g/uk-it-growth/ (ES modules), which a bundler has to follow.
[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite build output is content-hashed — safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy funnel assets (shared by /lp, /takk.html, /geo-audit, /case).
#
# These must revalidate, unlike /assets/* above. Vite content-hashes its output,
# so a changed file arrives under a new name and can be cached forever. These
# files do not: /js/consent.js keeps that name for ever, so "immutable" for a
# year meant an edit reached first-time visitors and nobody else, for up to a
# year, with no way to force it. That is how the consent banner and the pixel
# gate are delivered, so a stale copy is not cosmetic.
#
# max-age=0 with must-revalidate is a conditional request, not a download: the
# CDN answers 304 with no body while the file is unchanged. Every reference to
# these files also carries a ?v= token; bump it on the file you changed, which
# is what breaks copies already sitting in a browser cache from before this
# rule, since changing a header does not expire a response already stored.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The Visibility Dossier SPA is served at /audit/ (prebuilt output committed in
# public/audit/ — rebuild via: cd dossier && npm run build && cp -r dist ../public/audit).
[[headers]]
  for = "/audit/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/audit/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Client GEO-audit reports (served at /report/<slug>/, generated by
# scripts/build-reports.mjs from audits/*.json). These name a specific client's
# weaknesses, so they must never be indexed. Defence in depth: this header, the
# robots meta in the page itself, no index page, no inbound links anywhere, and
# a random slug suffix. Deliberately NOT in robots.txt: Disallow blocks
# crawling, not indexing, so a blocked crawler never reads the noindex — and
# robots.txt is public, which would advertise that a hidden section exists.
[[headers]]
  for = "/report/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Design drafts (served at /draft/<slug>/, generated by scripts/build-drafts.mjs).
# These look like a prospect's real website, so the same rule applies as to the
# reports and for the same reason: never indexed, never linked to, unguessable
# slug. Deliberately NOT in robots.txt, see the note on /report/* above.
[[headers]]
  for = "/draft/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Client review sets (served at /r/<slug>/...). Single-file exports of a named
# client's material, carrying figures that client has not signed off, on a
# domain that is not theirs. Same rule and same reasoning as /report/* and
# /draft/* above: never indexed, never linked to, unguessable slug, and
# deliberately NOT in robots.txt — Disallow stops the crawl, so the noindex
# below is never read, and robots.txt is public, which would announce that a
# review section exists.
[[headers]]
  for = "/r/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Campaign funnel pages under /g/<slug>. Everything except the landing page
# itself is a step in the funnel, not an entrance, and must not rank. The
# wildcard is attached to the page name rather than placed after a slash
# (/booking* not /booking/*), so it covers /booking and /booking/ but cannot
# match the bare parent /g/uk-private-clinics, which is the one page here that
# is meant to be found. Each page also carries a robots meta; this is defence
# in depth.
[[headers]]
  for = "/g/uk-private-clinics/booking*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/g/uk-private-clinics/booked*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/g/uk-private-clinics/not-a-fit*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/g/uk-private-clinics/not-now*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /uk-it-firms: same rule, same reason. Only the five outcome pages are
# named here. The landing page's indexing is decided by config.indexable in
# g/uk-it-larger-firms/config.json, through its robots meta, so that turning it
# on later is one setting in one place and not a setting here that overrides it.
[[headers]]
  for = "/uk-it-firms/book*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/uk-it-firms/takk*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/uk-it-firms/review*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/uk-it-firms/not-now*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/uk-it-firms/not-a-fit*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /g/uk-it-growth: the whole funnel is for paid traffic only, the landing page included, so the
# header covers the bare address and everything under it. Each page also carries a robots meta.
[[headers]]
  for = "/g/uk-it-growth"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/g/uk-it-growth/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /g/uk-private-hospitals: same as /g/uk-it-growth, paid traffic only.
[[headers]]
  for = "/g/uk-private-hospitals"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/g/uk-private-hospitals/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /g/uk-law-firms: same as /g/uk-it-growth, paid traffic only.
[[headers]]
  for = "/g/uk-law-firms"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/g/uk-law-firms/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /g/it-ict-growth: Italy, IT and ICT firms. Same as /g/uk-it-growth, paid traffic only.
[[headers]]
  for = "/g/it-ict-growth"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/g/it-ict-growth/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Self-hosted fonts and logos shared by every /g campaign. The filenames carry
# a version (fraunces-v1.woff2), so a replaced file arrives under a new name
# and this can safely be immutable; bump the name, never the file, or the old
# copy sits in browsers for a year. Same lesson as the /js block above.
[[headers]]
  for = "/g/_assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/g/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The funnel pages under the case study are not entrances and must not rank.
# The glob does not match the bare parent /case/what-a-client-costs, which stays
# indexable. Each page also carries a robots meta; this is defence in depth.
[[headers]]
  for = "/case/what-a-client-costs/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Nevari client proposal (served at /nevari/). Keep it out of search indexes:
# it contains commercial terms and must not be indexable.
[[headers]]
  for = "/nevari/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/nevari/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/nevari/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Redirects. ORDER MATTERS: specific rules must come before the SPA catch-all.
# Netlify serves real files first, so everything under public/ (lp, geo-audit,
# audit, case, nevari, takk.html, not-a-fit.html, css, js, images) always wins
# over these rewrites.
# ---------------------------------------------------------------------------

# Visibility Dossier SPA fallback: unknown /audit/* paths serve its app shell
[[redirects]]
  from = "/audit/*"
  to = "/audit/index.html"
  status = 200

# The Journey — scroll-story landing page (Kimi-built, static single file).
# Client-chosen URL is /the-journey. Must stay before the SPA catch-all.
[[redirects]]
  from = "/the-journey"
  to = "/journey.html"
  status = 200

[[redirects]]
  from = "/the-journey/"
  to = "/journey.html"
  status = 200

# Client audit reports. Real files under public/report/ are served first (Netlify
# always prefers a matching file over a non-forced redirect), so this rule only
# catches paths that do not exist — including bare /report, which must 404 rather
# than expose an index of client reports. Must stay before the SPA catch-all.
[[redirects]]
  from = "/report"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/report/*"
  to = "/404.html"
  status = 404

# Same shape as /report above: real files under public/draft/ win, so these only
# catch paths that do not exist, including bare /draft, which must 404 rather
# than hint that a draft section exists.
[[redirects]]
  from = "/draft"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/draft/*"
  to = "/404.html"
  status = 404

# Same shape as /report and /draft above: real files under public/r/ win, so
# these only catch paths that do not exist, including bare /r, which must 404
# rather than fall through to the SPA shell and answer 200 for a wrong URL.
[[redirects]]
  from = "/r"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/r/*"
  to = "/404.html"
  status = 404

# Case studies use extensionless URLs. The files live at
# public/case/<slug>/index.html, so the .html redirects below cannot loop:
# there is no file at the .html path to serve any more. Same shape as the
# proven /the-journey rule above. Must stay before the SPA catch-all.
# /case/avant-it is retired. It duplicated this case study, so it consolidates
# into it with a permanent redirect rather than a 404: the URL may already have
# been shared in email or outreach, and a dead link to a prospect is worse than
# the duplicate we are removing. 301, not 302, so the duplicate actually
# consolidates and any earned authority transfers.
[[redirects]]
  from = "/case/avant-it"
  to = "/case/what-a-client-costs"
  status = 301

[[redirects]]
  from = "/case/avant-it.html"
  to = "/case/what-a-client-costs"
  status = 301

# The case study and its funnel. Files live at public/case/<slug>/**/index.html.
[[redirects]]
  from = "/case/what-a-client-costs"
  to = "/case/what-a-client-costs/index.html"
  status = 200

[[redirects]]
  from = "/case/what-a-client-costs/apply"
  to = "/case/what-a-client-costs/apply/index.html"
  status = 200

[[redirects]]
  from = "/case/what-a-client-costs/booking"
  to = "/case/what-a-client-costs/booking/index.html"
  status = 200

[[redirects]]
  from = "/case/what-a-client-costs/thanks"
  to = "/case/what-a-client-costs/thanks/index.html"
  status = 200

[[redirects]]
  from = "/case/what-a-client-costs.html"
  to = "/case/what-a-client-costs"
  status = 301

# UK recruitment funnel. These must resolve to their own files: the SPA
# catch-all below answers 200 for any path, so a routing mistake here would not
# 404, it would serve the empty app shell with no pixel and look alive. The
# catch-all is not forced, so real files already win, and these rules make the
# four paths explicit rather than relying on that.
[[redirects]]
  from = "/uk-recruitment"
  to = "/uk-recruitment/index.html"
  status = 200

[[redirects]]
  from = "/uk-recruitment/booking"
  to = "/uk-recruitment/booking/index.html"
  status = 200

[[redirects]]
  from = "/uk-recruitment/thanks-booked"
  to = "/uk-recruitment/thanks-booked/index.html"
  status = 200

[[redirects]]
  from = "/uk-recruitment/thanks-review"
  to = "/uk-recruitment/thanks-review/index.html"
  status = 200

# Campaign funnel at /g/<slug>. Same shape as /uk-recruitment above. Netlify
# canonicalises an extensionless path to its trailing-slash form with a 301
# before it reaches these rules, so in practice they are documentation rather
# than what serves the page, exactly as for /case/what-a-client-costs. The rules
# that do the work are the two 404s below. Verified on the deploy preview for
# PR #67: /g/ and /g/<typo> both answer 404 rather than falling through to the
# SPA shell.
# 20 Oct 2026: the old clinics page quoted a per-booking price that the health
# funnel replaced (owner's yes the same day). Only the landing page moves; the
# booking, booked, not-a-fit and not-now pages below stay, because people who
# applied earlier may still hold links to them. "force" is needed because the
# static file exists and would otherwise win over the rule. Must stay above the
# 200 rule that follows.
[[redirects]]
  from = "/g/uk-private-clinics"
  to = "/g/uk-private-hospitals/"
  status = 301
  force = true

[[redirects]]
  from = "/g/uk-private-clinics"
  to = "/g/uk-private-clinics/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-private-clinics/booking"
  to = "/g/uk-private-clinics/booking/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-private-clinics/booked"
  to = "/g/uk-private-clinics/booked/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-private-clinics/not-a-fit"
  to = "/g/uk-private-clinics/not-a-fit/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-private-clinics/not-now"
  to = "/g/uk-private-clinics/not-now/index.html"
  status = 200

# /api/lead: receives the application forms of the growth funnels (g/uk-it-growth and the ones
# after it), decides the route and hands the lead on. Netlify matches a function that has its own
# path (config.path in netlify/functions/lead/index.mjs) BEFORE it looks at redirects, so that
# export is what serves it. This rule is the fallback for the day that export is removed: the
# function would then answer at its default address, and without a rule here the request would
# reach the SPA catch-all below and every submission would be answered with the homepage.
# Read g/uk-it-growth/LAUNCH.md before changing this.
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200

# /api/lead-interest: the quote request button on the "not the right fit" pages (netlify/functions/lead-interest).
# Same arrangement as /api/lead above: config.path in the function serves it, this rule is the fallback.
[[redirects]]
  from = "/api/lead-interest"
  to = "/.netlify/functions/lead-interest"
  status = 200

# /g/uk-it-growth: the landing page, the five pages after the form, and the privacy notice and website terms. Like the clinics funnel above,
# these are documentation more than routing: Netlify canonicalises an extensionless path to its
# trailing-slash form before it reaches the rules, and real files win over the 404s below.
[[redirects]]
  from = "/g/uk-it-growth"
  to = "/g/uk-it-growth/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-it-growth/book"
  to = "/g/uk-it-growth/book/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-it-growth/takk"
  to = "/g/uk-it-growth/takk/index.html"
  status = 200

[[redirects]]

# A mistyped address under the funnel must not fall through to the SPA catch-all and
# answer 200 with the homepage: no form, no pixel, nothing to say it is the wrong page.
# Real files win over this, so it only catches paths that do not exist.
[[redirects]]
  from = "/uk-it-firms/*"
  to = "/404.html"
  status = 404

# The funnel's first address, /g/uk-it-larger-firms, was live for a day. Anything that
# kept it lands on the new one. Permanent, so it consolidates. Before the /g/* 404.
[[redirects]]
  from = "/g/uk-it-larger-firms"
  to = "/uk-it-firms/"
  status = 301

[[redirects]]
  from = "/g/uk-it-larger-firms/*"
  to = "/uk-it-firms/:splat"
  status = 301

# Same shape as /report, /draft and /r above: real files under public/g/ win,
# including the fonts under /g/_assets, so these only catch paths that do not
# exist. Without them a mistyped ad URL such as /g/uk-private-clinicz falls
# through to the SPA catch-all and returns 200 with the homepage: no pixel, no
# form, and nothing to tell anyone it is the wrong page.
[[redirects]]
  from = "/g"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/g/*"
  to = "/404.html"
  status = 404

# Legacy landing page (moved from / to /lp): unknown /lp/* paths serve it
[[redirects]]
  from = "/lp/*"
  to = "/lp/index.html"
  status = 200

# React SPA fallback — deep links like /results must serve the app shell.
# MUST stay last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

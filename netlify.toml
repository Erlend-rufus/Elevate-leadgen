# /uk-it-firms: the application endpoint and the funnel's pages. The apply rule must
# come BEFORE the /uk-it-firms/* 404 further down and before the SPA catch-all: there is
# no file at that path, so either would otherwise answer every submission with a 404 or
# the homepage shell, and the form would fail for every visitor with nothing on the page
# to say why. The function also declares this path itself; both are kept so that neither
# a changed precedence nor a missing config can break it.
[[redirects]]
  from = "/uk-it-firms/apply"
  to = "/.netlify/functions/uk-it-apply"
  status = 200

[[redirects]]
  from = "/uk-it-firms"
  to = "/uk-it-firms/index.html"
  status = 200

[[redirects]]
  from = "/uk-it-firms/book"
  to = "/uk-it-firms/book/index.html"
  status = 200

[[redirects]]
  from = "/uk-it-firms/takk"
  to = "/uk-it-firms/takk/index.html"
  status = 200

[[redirects]]
  from = "/uk-it-firms/review"
  to = "/uk-it-firms/review/index.html"
  status = 200

[[redirects]]
  from = "/uk-it-firms/not-now"
  to = "/uk-it-firms/not-now/index.html"
  status = 200

[[redirects]]

  to = "/g/uk-it-growth/review/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-it-growth/not-now"
  to = "/g/uk-it-growth/not-now/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-it-growth/not-a-fit"
  to = "/g/uk-it-growth/not-a-fit/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-it-growth/privacy"
  to = "/g/uk-it-growth/privacy/index.html"
  status = 200

[[redirects]]
  from = "/g/uk-it-growth/terms"
  to = "/g/uk-it-growth/terms/index.html"
  status = 200


<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Not found</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#04041c;color:#b9bbd9;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    line-height:1.6;text-align:center}
  h1{color:#f4f5ff;font-size:clamp(24px,5vw,34px);margin:0 0 12px;font-weight:600}
  p{margin:0 0 24px;max-width:44ch}
  a{display:inline-block;color:#f4f5ff;text-decoration:none;font-weight:600;
    padding:13px 26px;border-radius:8px;background:linear-gradient(135deg,#00a3d6,#006aba,#02009a)}
  a:focus-visible{outline:3px solid #00a3d6;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <h1>That page is not here.</h1>
    <p>The link may be wrong, or the page may have moved. If you were sent a report link, check it against the original message.</p>
    <a href="/">Go to the homepage</a>
  </main>
</body>
</html>

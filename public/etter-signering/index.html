/* Skriftene er de samme selvhostede filene som /g-traktene bruker. Ingen forespørsel til Google Fonts. */
@font-face{font-family:Fraunces;src:url(/g/_assets/fonts/fraunces-v1.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Geist;src:url(/g/_assets/fonts/geist-v1.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{
  --paper:#f7f5f0;--paper-dark:#efede7;--white:#ffffff;
  --hairline:#cfcbc0;--hairline-soft:#e3e0d8;--field-border:#8b909c;
  --ink:#10141c;--ink-hover:#2a3140;--muted:#4a5162;--navy:#0a1628;--error:#b3261e;
  --bg:#f7f5f0;--fg:#10141c;--fg-2:#4a5162;
  --line:#cfcbc0;--line-2:#e3e0d8;--field:#8b909c;
  --fill:#efede7;
  --btn-bg:#10141c;--btn-fg:#f7f5f0;--btn-hover:#2a3140;--focus:#10141c;
  --head:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --gutter:clamp(24px,5vw,64px);--sec:clamp(56px,7vw,96px);--topH:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141c;--fg:#f7f5f0;--fg-2:rgba(247,245,240,.76);
    --line:rgba(247,245,240,.28);--line-2:rgba(247,245,240,.14);--field:rgba(247,245,240,.62);
    --fill:#171d29;
    --btn-bg:#f7f5f0;--btn-fg:#10141c;--btn-hover:#ffffff;--focus:#f7f5f0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141c;--fg:#f7f5f0;--fg-2:rgba(247,245,240,.76);
  --line:rgba(247,245,240,.28);--line-2:rgba(247,245,240,.14);--field:rgba(247,245,240,.62);
  --fill:#171d29;
  --btn-bg:#f7f5f0;--btn-fg:#10141c;--btn-hover:#ffffff;--focus:#f7f5f0;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 19px/1.55 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
h1,h2,h3,h4,p,ul,ol,dl,dd,dt,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none!important}

h1,h2,h3{font-family:var(--head);font-weight:400;letter-spacing:-.01em;color:var(--fg)}
h1{font-size:clamp(34px,4.6vw,64px);line-height:1.06;text-wrap:balance}
h2{font-size:clamp(26px,2.9vw,40px);line-height:1.12;text-wrap:balance}
h3{font-size:clamp(22px,2.2vw,28px);line-height:1.2;text-wrap:balance}
p,li{text-wrap:pretty}

.wrap{max-width:calc(1200px + 2 * var(--gutter));margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.sec{padding-block:var(--sec);border-top:1px solid var(--line);scroll-margin-top:var(--topH)}
.hero{padding-block:clamp(44px,6vw,88px) var(--sec);scroll-margin-top:var(--topH)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 48px;flex-wrap:wrap;margin-bottom:clamp(28px,3.5vw,44px)}
.sh .sub{max-width:54ch;color:var(--fg-2)}
.eyebrow{font:600 15px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2);margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:28px;min-height:64px}
.brand{font:400 23px/1 var(--head);color:var(--fg);white-space:nowrap}
.nav{display:flex;gap:24px;margin-left:auto}
.nav a{color:var(--fg);text-decoration:none;font-size:16px;font-weight:500;padding:21px 0 18px;border-bottom:3px solid transparent;cursor:pointer}
.nav a:hover{border-bottom-color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-left:auto}
.nav + .seg{margin-left:0}
.seg button{appearance:none;background:transparent;border:0;min-height:44px;min-width:52px;padding:0 14px;font:600 16px/1 var(--body);letter-spacing:.04em;cursor:pointer}
.seg button:focus-visible{outline-offset:-4px}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg)}

/* hero */
.hero h1{max-width:22ch}
.lead{font-size:20px;line-height:1.55;max-width:58ch;margin-top:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(32px,4vw,56px);border-top:1px solid var(--line)}
.stat{padding:22px 28px 4px 0}
.stat+.stat{padding-left:28px;border-left:1px solid var(--line-2)}
.stat b{display:block;font:400 clamp(26px,2.7vw,38px)/1.1 var(--head);margin-bottom:8px}
.stat span{display:block;font-size:17px;line-height:1.45;color:var(--fg-2);max-width:32ch}
.note{margin-top:22px;font-size:17px;color:var(--fg-2);max-width:72ch}

/* buttons and chips */
.btn{appearance:none;border:1px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);font:500 18px/1 var(--body);padding:14px 22px;min-height:48px;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.ghost:hover{background:var(--fill)}
.btn[disabled]{opacity:.38;cursor:default}
.btn[disabled]:hover{background:var(--btn-bg);border-color:var(--btn-bg)}
.btn.ghost[disabled]:hover{background:transparent;border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:500 17px/1 var(--body);padding:12px 16px;min-height:44px;border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
.step button{appearance:none;display:block;width:100%;height:100%;text-align:left;background:transparent;border:0;border-top:3px solid transparent;margin-top:-1px;padding:20px 20px 22px 0;cursor:pointer;color:var(--fg)}
.step button[aria-selected="true"]{border-top-color:var(--fg)}
.step .num{display:block;font:400 34px/1 var(--head);margin-bottom:12px;color:var(--fg-2)}
.step button[aria-selected="true"] .num{color:var(--fg)}
.step .nm{display:block;font-weight:600;font-size:19px;line-height:1.25}
.step .sb{display:block;color:var(--fg-2);font-size:16px;line-height:1.4;margin-top:4px}
.panel{border-top:1px solid var(--line);padding-top:clamp(24px,3vw,36px)}
.panel:focus-visible{outline-offset:6px}
.pt{display:flex;justify-content:space-between;align-items:flex-start;gap:20px 32px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,36px)}
.when{color:var(--fg-2);margin-top:10px;max-width:60ch}
.pn{display:flex;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,64px)}
.col h4,.grp .gt{font:600 15px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2);padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:4px}
ul.tick li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
ul.tick svg{width:22px;height:22px;margin-top:4px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}

/* checklist */
.tools{display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:20px;margin:24px 0 8px}
.track{flex:1;height:6px;background:var(--line-2);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0;background:var(--fg);transition:width .25s ease}
#ptxt{white-space:nowrap;color:var(--fg-2);font-size:17px}
#cpmsg{min-height:1.6em;font-size:17px;color:var(--fg-2)}
.cgrid{margin-top:20px;column-count:2;column-gap:clamp(28px,4vw,64px)}
.grp{break-inside:avoid;margin-bottom:32px}
.ck{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line-2)}
.ck label{flex:1;display:flex;align-items:center;gap:16px;padding:12px 0;cursor:pointer;min-height:60px}
.ck input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.box{flex:none;width:28px;height:28px;border:2px solid var(--field);border-radius:2px;display:grid;place-items:center;background:var(--bg)}
.box svg{width:18px;height:18px;opacity:0;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square}
.ck input:checked + .box{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.ck input:checked + .box svg{opacity:1}
.ck input:focus-visible + .box{outline:3px solid var(--focus);outline-offset:3px}
.ck.on .tx{color:var(--fg-2)}
.own{flex:none;font:600 14px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:7px 9px;border:1px solid var(--line);border-radius:2px;color:var(--fg-2)}
.own.o-we{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.own.o-both{border-style:dashed}
.out{display:block;width:100%;margin-top:20px;padding:16px;background:var(--bg);color:var(--fg);border:1px solid var(--field);border-radius:4px;font:400 17px/1.5 var(--body);resize:vertical}

/* flow */
.flow{display:grid;grid-template-columns:repeat(9,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.flow button{appearance:none;display:flex;flex-direction:column;gap:8px;width:100%;height:100%;text-align:left;background:transparent;color:var(--fg);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 10px 16px;cursor:pointer}
.flow button .n{font:400 24px/1 var(--head)}
.flow button .l{font-size:16px;font-weight:500;line-height:1.25}
.flow button[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-fg)}
.flow button:focus-visible{outline-offset:-5px;outline-color:var(--focus)}
.flow button[aria-selected="true"]:focus-visible{outline-color:var(--btn-fg)}
.fpanel{display:grid;grid-template-columns:1fr;gap:clamp(24px,3vw,40px);padding-top:clamp(24px,3vw,36px)}
.fpanel h3{margin-bottom:12px}
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.fhead .fnum{font:600 15px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2)}
.fpanel .pn{margin-top:24px}

/* who and always */
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(28px,4vw,64px)}
.who h3{padding-bottom:14px;border-bottom:3px solid var(--fg);margin-bottom:4px}
.alw{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);counter-reset:a}
.alw li{counter-increment:a;padding:24px 22px 28px 0;margin-right:22px;border-right:1px solid var(--line-2);font-size:18px;line-height:1.45}
.alw li:last-child{border-right:0;margin-right:0}
.alw li::before{content:counter(a);display:block;font:400 30px/1 var(--head);color:var(--fg-2);margin-bottom:14px}

/* footer */
.foot{background:var(--navy);color:rgba(255,255,255,.86);padding-block:clamp(40px,5vw,64px);border-top:1px solid rgba(255,255,255,.18)}
.fw{display:flex;justify-content:space-between;gap:24px 48px;flex-wrap:wrap;font-size:17px;line-height:1.55}
.fw .fb{font:400 24px/1.2 var(--head);color:#ffffff;margin-bottom:8px}
.fr{max-width:36ch}
.foot :focus-visible{outline-color:#ffffff}

/* responsive */
@media (max-width:1040px){
  .nav{display:none}
  .seg{margin-left:auto}
  .flow{grid-template-columns:repeat(3,1fr)}
  .alw{grid-template-columns:1fr 1fr}
  .alw li{border-right:0;margin-right:0;border-bottom:1px solid var(--line-2)}
  .alw li:last-child{border-bottom:0}
}
@media (max-width:900px){
  .steps{grid-template-columns:1fr}
  .step button{border-top:0;border-left:3px solid transparent;border-bottom:1px solid var(--line-2);margin-top:0;padding:16px 12px 16px 14px;display:grid;grid-template-columns:48px 1fr;column-gap:6px;align-items:start}
  .step button[aria-selected="true"]{border-left-color:var(--fg)}
  .step .num{grid-row:1/3;margin:0;font-size:30px}
  .cols,.who{grid-template-columns:1fr}
  .cgrid{column-count:1}
  .stats{grid-template-columns:1fr}
  .stat,.stat+.stat{padding:18px 0;border-left:0;border-bottom:1px solid var(--line-2)}
  .stat:last-child{border-bottom:0}
  .alw{grid-template-columns:1fr}
}
@media (max-width:520px){
  .flow{grid-template-columns:repeat(2,1fr)}
  .flow button:last-child{grid-column:1/-1}
  .bar{gap:12px}
  .brand{font-size:21px}
  .prog{flex-direction:column;align-items:stretch;gap:8px}
  #ptxt{white-space:normal}
  .ck{display:block;padding-bottom:14px}
  .ck label{padding-bottom:8px}
  .ck .own{display:inline-block;margin-left:44px}
}
</style>

function remText(){
 var all=CHK,items=all.filter(function(c){return !S.chk[c.id]});
 if(!items.length)return U("nothing");
 var out=[U("rem")+" ("+items.length+" "+U("of")+" "+all.length+")",""];
 [1,2,3,4,5].forEach(function(g){
  var gi=items.filter(function(c){return c.ph===g});
  if(!gi.length)return;
  out.push(groupTitle(g));
  gi.forEach(function(c){out.push("- "+T(c.t)+" ("+ownLabel(c.w)+")")});
  out.push("");
 });
 return out.join("\n").replace(/\s+$/,"");
}
function manual(txt){
 var o=$("cpout");if(!o)return;
 o.innerHTML='<textarea class="out" readonly rows="10" aria-label="'+esc(U("rem"))+'">'+esc(txt)+'</textarea>';
 var ta=o.querySelector("textarea");if(ta){ta.focus();ta.select()}
}
function doCopy(){
 var txt=remText();
 function ok(){var o=$("cpout");if(o)o.innerHTML="";say(U("copied"))}
 function fail(){manual(txt);say(U("copyFail"))}
 function legacy(){
  try{
   var ta=document.createElement("textarea");
   ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.left="-9999px";
   document.body.appendChild(ta);ta.select();
   var r=document.execCommand("copy");
   document.body.removeChild(ta);
   if(r)ok();else fail();
  }catch(e){fail()}
 }
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,legacy)}
  else legacy();
 }catch(e){legacy()}
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
 var t=e.target;if(!t||!t.closest)return;
 var b;
 if((b=t.closest("[data-ph]"))){setPh(+b.getAttribute("data-ph"),true);return}
 if((b=t.closest("[data-fl]"))){setFl(+b.getAttribute("data-fl"),true);return}
 if((b=t.closest("[data-step]"))){if(!b.disabled)setPh(S.ph+(+b.getAttribute("data-step")),false);return}
 if((b=t.closest("[data-fstep]"))){if(!b.disabled)setFl(S.fl+(+b.getAttribute("data-fstep")),false);return}
 if((b=t.closest("[data-own]"))){
  S.own=b.getAttribute("data-own");renderChk();
  var nb=document.querySelector('[data-own="'+S.own+'"]');if(nb)nb.focus();return;
 }
 if((b=t.closest("[data-lang]"))){setLang(b.getAttribute("data-lang"));return}
 if((b=t.closest("[data-go]"))){e.preventDefault();go(b.getAttribute("data-go"));return}
 if(t.closest("#cp")){doCopy();return}
 if(t.closest("#rs")){S.chk={};save();renderChk();say(U("resetDone"));return}
});

document.addEventListener("change",function(e){
 var t=e.target;
 if(t&&t.getAttribute&&t.getAttribute("data-ck")){
  var id=t.getAttribute("data-ck");
  if(t.checked)S.chk[id]=true;else delete S.chk[id];
  save();
  var row=t.closest(".ck");if(row)row.classList.toggle("on",t.checked);
  updProg();
 }
});

document.addEventListener("keydown",function(e){
 var t=e.target;
 if(t&&t.getAttribute&&t.getAttribute("role")==="tab"){
  var list=t.closest('[role="tablist"]');if(!list)return;
  var tabs=[].slice.call(list.querySelectorAll('[role="tab"]')),i=tabs.indexOf(t),n=i;
  if(e.key==="ArrowRight"||e.key==="ArrowDown")n=(i+1)%tabs.length;
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp")n=(i-1+tabs.length)%tabs.length;
  else if(e.key==="Home")n=0;
  else if(e.key==="End")n=tabs.length-1;
  else return;
